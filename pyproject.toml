[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvia-sauna"
version = "1.0.0"
description = "HomeKit integration and CLI for Harvia Xenio WiFi sauna"
requires-python = ">=3.9"
dependencies = [
    "HAP-python>=4.9.2",
    "boto3>=1.34.69",
    "pycognito>=2024.2.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
harvia-sauna = "harvia_sauna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
